services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: "${POSTGRES_DB}", POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}" }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment: { RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}", RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}" }
    ports: ["5672:5672", "15672:15672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, retries: 10 }
  api:
    build: { context: ., dockerfile: src/TaskFlow.Api/Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      Database__ApplyMigrationsOnStartup: "true"
      Seed__DemoData: "${SEED_DEMO_DATA}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD}"
      Seed__EmployeePassword: "${SEED_EMPLOYEE_PASSWORD}"
      ReverseProxy__Enabled: "true"
      OpenApi__Enabled: "true"
      Worker__RunInApi: "false"
    ports: ["5080:8080"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  worker:
    build: { context: ., dockerfile: src/TaskFlow.Worker/Dockerfile }
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
    depends_on: { api: { condition: service_started }, rabbitmq: { condition: service_healthy } }
    restart: unless-stopped
  web:
    build: { context: frontend }
    ports: ["3000:80"]
    depends_on: [api]
volumes:
  pgdata:
